name: iOS Simulator Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_ipa:
        description: Build a device IPA (requires Apple signing secrets and an Ad Hoc profile with your iPhone registered)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Simulator app
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project ios/XJTUToolbox.xcodeproj
          -scheme XJTUToolbox
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: XJTUToolbox-simulator-${{ github.sha }}
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/XJTUToolbox.app
          if-no-files-found: error
          retention-days: 7

  unsigned-device-ipa:
    name: Package unsigned iPhone IPA
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build for iPhone device
        run: >-
          xcodebuild
          -project ios/XJTUToolbox.xcodeproj
          -scheme XJTUToolbox
          -configuration Debug
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DeviceDerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R build/DeviceDerivedData/Build/Products/Debug-iphoneos/XJTUToolbox.app build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -r ../XJTUToolbox-unsigned.ipa Payload

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: XJTUToolbox-unsigned-ipa-${{ github.sha }}
          path: build/XJTUToolbox-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  signed-ipa:
    name: Build signed iPhone IPA
    if: github.event_name == 'workflow_dispatch' && inputs.build_ipa
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Install Apple signing assets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/ios-signing"
          mkdir -p "$SIGNING_DIR" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$SIGNING_DIR/certificate.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$SIGNING_DIR/profile.mobileprovision"
          security cms -D -i "$SIGNING_DIR/profile.mobileprovision" > "$SIGNING_DIR/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$SIGNING_DIR/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$SIGNING_DIR/profile.plist")
          cp "$SIGNING_DIR/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          KEYCHAIN_PATH="$SIGNING_DIR/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$SIGNING_DIR/certificate.p12" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive for iPhone
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: >-
          xcodebuild
          -project ios/XJTUToolbox.xcodeproj
          -scheme XJTUToolbox
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/XJTUToolbox.xcarchive
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY='Apple Distribution'
          DEVELOPMENT_TEAM="$IOS_TEAM_ID"
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          archive

      - name: Export Ad Hoc IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string ad-hoc' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :teamID string '"$IOS_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles:cn.xjtu.toolbox.ios string '"$PROFILE_NAME" "$EXPORT_OPTIONS"
          xcodebuild -exportArchive -archivePath build/XJTUToolbox.xcarchive -exportPath build/ipa -exportOptionsPlist "$EXPORT_OPTIONS"

      - name: Upload signed iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: XJTUToolbox-adhoc-${{ github.sha }}
          path: build/ipa/XJTUToolbox.ipa
          if-no-files-found: error
          retention-days: 7
